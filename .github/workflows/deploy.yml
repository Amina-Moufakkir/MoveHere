# Build, verify, and publish the static export to GitHub Pages.
#
# Verification runs before the build, not after: a deploy that ships content the
# contract suite rejects would be worse than no deploy. The base path is supplied
# here rather than committed to next.config.mjs so local development keeps
# serving from the root.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel a run mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /MoveHere

      # Belt and braces: the Pages artifact path is served as-is, but a stray
      # Jekyll pass would drop _next/ entirely.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
